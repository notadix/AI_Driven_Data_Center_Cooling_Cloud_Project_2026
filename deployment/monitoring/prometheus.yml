# Prometheus scrape configuration for the Cooling Digital Twin stack.
# The FastAPI backend exposes /metrics (Prometheus text format, dedicated
# COOLING_REGISTRY) via src/backend/metrics.py.  Gauges are updated at
# scrape time; interval is 15 s.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cooling-twin-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
